name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: PocketSoundMixer-${{ runner.os }}
          path: |
            build/Release/PocketSoundMixer.exe
            build/PocketSoundMixer
          if-no-files-found: error

      # Release packages are only built for version tags (v1.2.3).
      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Release/PocketSoundMixer.exe, LICENSE -DestinationPath PocketSoundMixer-${{ github.ref_name }}-Windows-x64.zip

      - name: Package (macOS / Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          arch=$(uname -m)
          tar -czf "PocketSoundMixer-${{ github.ref_name }}-${{ runner.os }}-${arch}.tar.gz" -C build PocketSoundMixer -C .. LICENSE

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ runner.os }}
          path: PocketSoundMixer-${{ github.ref_name }}-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "PocketSoundMixer ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
